# RabbitMQ Prod
spring.rabbitmq.host=${RABBITMQ_HOST:rabbitmq-prod}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:admin}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:secret}

# Email Prod
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
management.health.mail.enabled=true

# Feign Clients Prod
aluno.service.url=${ALUNO_SERVICE_URL:http://aluno-service:8081}
